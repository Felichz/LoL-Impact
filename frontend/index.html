<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Qué movió tus partidas de LoL, con la duda del modelo a la vista." />
    <title>LoLImpact</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        var t = localStorage.getItem("lolimpact.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <!--
      THESIS: A game is a tensegrity column. Each evaluated minute is a node pushed off the red 50% axis; lanes are cords that pull on it. Refuses the category's dark stat-card dashboard.
      OWN-WORLD: Concrete-pale ground, carbon-black rods with ring nodes, tension-red cords and axis, slack-ash for anything unconfirmed (it literally sags). Martian Mono for labels, figures and leader-line annotations; Geist for prose. Chamfered buttons, hairline rules with red node dots.
      STORY: The player sees how their team's chance rose or fell, which lane pulled hardest, and how sure the model is — then checks live games and drafts in the same grammar.
      FIRST VIEWPORT: Left rail with profile pattern and match list; main area opens on the latest game: readout at left, the vertical column chart (time rising) at right with pinned annotations. Load control in header.
      FORM: Tensegrity column (challenger, user-picked over roll #7); seed fab76e92.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
